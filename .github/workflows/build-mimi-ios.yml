name: Build Mimi Money iOS (.ipa)

on:
  push:
    branches: [ main, "feat/**" ]
    # SideStore JSON bumps are committed by this workflow; don't rebuild IPA for them.
    paths-ignore:
      - "sidestore/**"
      - ".github/workflows/sidestore-pages.yml"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "sidestore/**"
      - ".github/workflows/sidestore-pages.yml"
  workflow_dispatch:

jobs:
  test-and-package-ios:
    name: Swift Test & Package iOS IPA
    runs-on: macos-latest
    # pages + id-token: upload Pages artifact after IPA; deploy job consumes it.
    # GITHUB_TOKEN chore(sidestore) pushes do NOT trigger sidestore-pages.yml.
    permissions:
      contents: write
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: mimi-money-ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Swift & Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Run Structural & Spec Verification
        run: node scripts/verify-swift-project.mjs --all

      - name: Run MimiMoneyTests (macOS host unit tests)
        run: swift test

      - name: Build iOS executable (SwiftPM, same as before)
        run: |
          IOS_SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "IOS_SDK_PATH=${IOS_SDK_PATH}" >> "$GITHUB_ENV"
          # Step 1: compile the package normally (produces the executable).
          swift build -c release --product MimiMoneyApp \
            --triple arm64-apple-ios17.0 \
            -Xswiftc -sdk -Xswiftc "${IOS_SDK_PATH}" \
            -Xcc -isysroot -Xcc "${IOS_SDK_PATH}"
          BIN_PATH="$(find .build -path "*/release/MimiMoneyApp" -type f | head -n 1)"
          echo "BIN_PATH=${BIN_PATH}" >> "$GITHUB_ENV"
          echo "Built executable: ${BIN_PATH}"

      - name: Stage 1 — harvest const values (const-gather-protocols)
        run: |
          # Evidence-based route (xtool-on-linux docs/SIRI.md + Swift Package
          # Index build logs): the missing piece all along was the const-gather
          # PROTOCOL LIST. Xcode passes it via SWIFT_EMIT_CONST_VALUE_PROTOCOLS;
          # a bare swift build / swiftc without it emits .swiftconstvalues that
          # contain NO AppIntent constants, so the metadata processor in the
          # next step has nothing to extract. The list is vendored at
          # tools/appintents-protocols.json (see tools/README.md).
          set -euo pipefail
          # NOTE: the doc's `--swift-sdk arm64-apple-ios` form is for Linux
          # Swift SDK bundles; on this macOS runner it picked the MacOSX
          # sysroot ("unable to load standard library for target
          # arm64-apple-ios17.0"). Use the main build's proven triple + SDK
          # flags instead; the protocol-list flags are the actual fix.
          swift build -c debug --triple arm64-apple-ios17.0 \
            -Xswiftc -sdk -Xswiftc "${IOS_SDK_PATH}" \
            -Xcc -isysroot -Xcc "${IOS_SDK_PATH}" \
            -Xswiftc -Xfrontend -Xswiftc -const-gather-protocols-file -Xswiftc -Xfrontend -Xswiftc tools/appintents-protocols.json \
            -Xswiftc -emit-const-values
          echo "--- harvested .swiftconstvalues ---"
          find .build -name '*.swiftconstvalues' | sort
          HITS="$(find .build -name '*.swiftconstvalues' -exec grep -a -l "ScanScreenshotIntent" {} + || true)"
          if [ -z "${HITS}" ]; then
            echo "::error::Harvested .swiftconstvalues do not contain ScanScreenshotIntent — the protocol list did not take effect; not proceeding to stage 2"
            exit 1
          fi
          echo "✅ ScanScreenshotIntent present in harvested const values:"
          echo "${HITS}"
          find .build -name '*.swiftconstvalues' | sort | sed "s|^\.build|${PWD}/.build|" > swift-const-vals-list.txt
          find "${PWD}/Sources/MimiMoneyCore" -name '*.swift' | sort > source-file-list.txt
          wc -l swift-const-vals-list.txt source-file-list.txt

      - name: Extract AppIntents metadata (appintentsmetadataprocessor)
        run: |
          # ------------------------------------------------------------------
          # Why this step exists:
          # `swift build` + manual .app assembly NEVER runs Xcode's AppIntents
          # metadata extraction, so previous IPAs shipped without
          # Metadata.appintents and iOS could not discover the
          # 「识别账单」 (ScanScreenshotIntent) action in Shortcuts at all.
          # We feed Xcode's own appintentsmetadataprocessor with the const
          # values harvested in Stage 1 (module MimiMoneyCore, where the
          # AppIntents definitions live).
          # ------------------------------------------------------------------
          set -euo pipefail
          XCODE_CONTENTS="$(xcode-select -p | sed 's|/Developer$||')"
          PROCESSOR="$(find "${XCODE_CONTENTS}" -name appintentsmetadataprocessor -type f 2>/dev/null | head -n 1)"
          if [ -z "${PROCESSOR}" ]; then
            PROCESSOR="$(xcrun --find appintentsmetadataprocessor 2>/dev/null || true)"
          fi
          if [ -z "${PROCESSOR}" ] || [ ! -x "${PROCESSOR}" ]; then
            echo "::error::appintentsmetadataprocessor not found in the selected Xcode toolchain"
            exit 1
          fi
          echo "Using metadata processor: ${PROCESSOR}"

          # Xcode 26 processor interface (from its own --help USAGE):
          # it consumes a --source-file-list and a --swift-const-vals-list
          # (both are FILES of paths); it no longer reads the binary.
          TOOLCHAIN_DIR="$(dirname "$(dirname "$(dirname "${PROCESSOR}")")")"
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          echo "Toolchain dir: ${TOOLCHAIN_DIR}"
          echo "Xcode version: ${XCODE_VERSION}"

          if [ ! -s swift-const-vals-list.txt ] || [ ! -s source-file-list.txt ]; then
            echo "::error::Stage 1 did not produce swift-const-vals-list.txt / source-file-list.txt"
            exit 1
          fi
          echo "--- swift-const-vals-list ($(wc -l < swift-const-vals-list.txt) files) ---"
          cat swift-const-vals-list.txt

          # Confirm the exact flag spelling from the tool itself first
          # (SPI build logs come from older Xcodes; this runner's may differ).
          HELP="$("${PROCESSOR}" --help 2>&1 || true)"
          echo "${HELP}"
          if ! grep -q -- "--swift-const-vals-list" <<< "${HELP}"; then
            echo "::error::This appintentsmetadataprocessor does not support --swift-const-vals-list"
            exit 1
          fi

          ARGS=(
            --output "${PWD}/appintents-out/Metadata.appintents"
            --toolchain-dir "${TOOLCHAIN_DIR}"
            --module-name MimiMoneyCore
            --sdk-root "${IOS_SDK_PATH}"
            --xcode-version "${XCODE_VERSION}"
            --platform-family iOS
            --deployment-target 17.0
            --target-triple arm64-apple-ios17.0
            --source-file-list "${PWD}/source-file-list.txt"
            --swift-const-vals-list "${PWD}/swift-const-vals-list.txt"
            --force
            --deployment-aware-processing
          )
          # Flags that exist only on some Xcode versions (older SPI logs show
          # --binary-file / --bundle-identifier / --compile-time-extraction):
          # include each only when this processor's --help actually lists it.
          if grep -q -- "--binary-file" <<< "${HELP}"; then ARGS+=(--binary-file "${BIN_PATH}"); fi
          if grep -q -- "--bundle-identifier" <<< "${HELP}"; then ARGS+=(--bundle-identifier com.jinghao.mimimoney); fi
          if grep -q -- "--compile-time-extraction" <<< "${HELP}"; then ARGS+=(--compile-time-extraction); fi
          if grep -q -- "--validate-assistant-intents" <<< "${HELP}"; then ARGS+=(--validate-assistant-intents); fi

          rm -rf appintents-out
          mkdir -p appintents-out
          "${PROCESSOR}" "${ARGS[@]}"

          echo "--- generated files ---"
          find appintents-out -type f | sort

      - name: Assemble .app bundle (with Metadata.appintents, WITHOUT legacy .shortcut)
        run: |
          rm -rf build
          mkdir -p build/Payload/MimiMoneyApp.app
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_BUILD="$(xcrun --sdk iphoneos --show-sdk-build-version)"
          XCODE_BUILD="$(xcodebuild -version | awk 'NR==2 {print $3}')"
          APP_VERSION="$(cat VERSION 2>/dev/null || echo "1.0.1")"

          cp "${BIN_PATH}" build/Payload/MimiMoneyApp.app/MimiMoneyApp
          chmod 755 build/Payload/MimiMoneyApp.app/MimiMoneyApp

          # Ship the extracted AppIntents metadata inside the .app so that
          # iOS registers 识别账单 / 修改账单 / 确认记账 for Shortcuts & Siri.
          ACTIONS_SRC="$(find appintents-out -name extract.actionsdata -type f | head -n 1)"
          if [ -z "${ACTIONS_SRC}" ]; then
            echo "::error::extract.actionsdata was not generated by appintentsmetadataprocessor"
            find appintents-out | sort || true
            exit 1
          fi
          MD_DIR="$(dirname "${ACTIONS_SRC}")"
          if [ "$(basename "${MD_DIR}")" = "Metadata.appintents" ]; then
            cp -R "${MD_DIR}" build/Payload/MimiMoneyApp.app/
          else
            mkdir -p build/Payload/MimiMoneyApp.app/Metadata.appintents
            cp -R "${MD_DIR}/." build/Payload/MimiMoneyApp.app/Metadata.appintents/
          fi
          echo "Copied AppIntents metadata from ${MD_DIR}"

          # Write standard 8-byte PkgInfo
          printf "APPL????" > build/Payload/MimiMoneyApp.app/PkgInfo

          # Copy real Mimi Money PNG App Icons
          echo "Copying custom Mimi Money AppIcon assets..."
          cp Resources/AppIcon60x60@2x.png build/Payload/MimiMoneyApp.app/AppIcon60x60@2x.png
          cp Resources/AppIcon60x60@3x.png build/Payload/MimiMoneyApp.app/AppIcon60x60@3x.png
          cp Resources/AppIcon76x76@2x.png build/Payload/MimiMoneyApp.app/AppIcon76x76@2x.png
          cp Resources/AppIcon1024.png build/Payload/MimiMoneyApp.app/AppIcon1024.png

          cat > build/Payload/MimiMoneyApp.app/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleDisplayName</key>
            <string>咪咪记账</string>
            <key>CFBundleExecutable</key>
            <string>MimiMoneyApp</string>
            <key>CFBundleIconFiles</key>
            <array>
              <string>AppIcon60x60@2x.png</string>
              <string>AppIcon60x60@3x.png</string>
            </array>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>AppIcon60x60</string>
                </array>
                <key>CFBundleIconName</key>
                <string>AppIcon</string>
              </dict>
            </dict>
            <key>CFBundleIdentifier</key>
            <string>com.jinghao.mimimoney</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>MimiMoneyApp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleSupportedPlatforms</key>
            <array>
              <string>iPhoneOS</string>
            </array>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER:-1}</string>
            <key>DTCompiler</key>
            <string>com.apple.compilers.llvm.clang.1_0</string>
            <key>DTPlatformBuild</key>
            <string>${SDK_BUILD}</string>
            <key>DTPlatformName</key>
            <string>iphoneos</string>
            <key>DTPlatformVersion</key>
            <string>${SDK_VERSION}</string>
            <key>DTSDKBuild</key>
            <string>${SDK_BUILD}</string>
            <key>DTSDKName</key>
            <string>iphoneos${SDK_VERSION}</string>
            <key>DTXcode</key>
            <string>1600</string>
            <key>DTXcodeBuild</key>
            <string>${XCODE_BUILD}</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>17.0</string>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>NSMicrophoneUsageDescription</key>
            <string>用于语音一句话记多笔账单</string>
            <key>NSSpeechRecognitionUsageDescription</key>
            <string>用于识别您的记账语音内容</string>
            <key>NSCameraUsageDescription</key>
            <string>用于拍摄小票与收据自动记账</string>
            <key>NSPhotoLibraryUsageDescription</key>
            <string>用于读取付款截图与添加账单图片附件</string>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key>
                <string>com.jinghao.mimimoney.deeplink</string>
                <key>CFBundleURLSchemes</key>
                <array>
                  <string>mimimoney</string>
                </array>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

          # Convert Info.plist to standard Apple binary plist and ad-hoc sign
          plutil -convert binary1 build/Payload/MimiMoneyApp.app/Info.plist
          codesign --force --deep --sign - build/Payload/MimiMoneyApp.app

      - name: Verify AppIntents metadata inside .app (HARD GATE)
        run: |
          # Fail the whole build if the metadata iOS needs is missing or does
          # not register the 识别账单 intent. This is the regression guard for
          # the v1.0.9 bug (IPA shipped with no Metadata.appintents at all).
          set -euo pipefail
          ACTIONS_DATA="build/Payload/MimiMoneyApp.app/Metadata.appintents/extract.actionsdata"
          if [ ! -f "${ACTIONS_DATA}" ]; then
            echo "::error::Metadata.appintents/extract.actionsdata is MISSING from the .app — iOS would not discover the 识别账单 action"
            find build/Payload/MimiMoneyApp.app -maxdepth 2 | sort || true
            exit 1
          fi
          if ! grep -a -q "ScanScreenshotIntent" "${ACTIONS_DATA}"; then
            echo "::error::extract.actionsdata does not contain ScanScreenshotIntent"
            exit 1
          fi
          # The legacy clipboard/openURL .shortcut flow must never come back into the bundle.
          if [ -e "build/Payload/MimiMoneyApp.app/MimiScreenshotBookkeeping.shortcut" ]; then
            echo "::error::Legacy .shortcut file must not be bundled into the .app"
            exit 1
          fi
          echo "✅ AppIntents verification passed:"
          ls -la build/Payload/MimiMoneyApp.app/Metadata.appintents/
          grep -a -o "ScanScreenshotIntent" "${ACTIONS_DATA}" | head -n 1

      - name: Package IPA (versioned asset name)
        run: |
          # 资产文件名带版本号（取自 VERSION），下载到电脑后一眼分清版本。
          APP_VERSION="$(cat VERSION 2>/dev/null || echo "1.0.1")"
          IPA_NAME="MimiMoney-iOS-v${APP_VERSION}.ipa"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"
          cd build && zip -qry "${IPA_NAME}" Payload
          echo "Packaged IPA: build/${IPA_NAME}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: MimiMoney-iOS-IPA
          path: mimi-money-ios/build/${{ env.IPA_NAME }}

      - name: Publish IPA to GitHub Releases
        # Skip re-publish when the only change is a SideStore source bump from this workflow.
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(sidestore):')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="$(cat VERSION 2>/dev/null || echo "1.0.1")"
          export RELEASE_TAG="v${APP_VERSION}"
          export IPA_FILE="MimiMoney-iOS-v${APP_VERSION}.ipa"
          echo "Publishing release for ${RELEASE_TAG}..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}" --force

          node -e "
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const changelogPath = fs.existsSync('CHANGELOG.md') ? 'CHANGELOG.md' : 'mimi-money-ios/CHANGELOG.md';
            let content = '';
            if (fs.existsSync(changelogPath)) {
              const text = fs.readFileSync(changelogPath, 'utf8').replace(/\r\n/g, '\n');
              const startIdx = text.indexOf('## [' + tag + ']');
              if (startIdx !== -1) {
                const nextIdx = text.indexOf('\n## [', startIdx + 4);
                content = (nextIdx !== -1 ? text.substring(startIdx, nextIdx) : text.substring(startIdx)).trim();
              }
            }
            if (!content) {
              content = '## [' + tag + ']\n\n- 咪咪记账 iOS ' + tag + ' 自动化发布版本';
            }
            content += '\n\n### 📦 资产下载\n- **' + (process.env.IPA_FILE || 'MimiMoney-iOS.ipa') + '**：App 安装包（建议使用 Sideloadly / AltStore 签名安装）\n- 快捷指令无需下载任何文件：安装 App 后在系统「快捷指令」中添加内置动作「识别账单」即可（App 内「自动记账」页有四种触发方式的图文教程）';
            fs.writeFileSync('RELEASE_NOTES.md', content);
          "

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "build/${IPA_FILE}" --clobber
            gh release edit "${RELEASE_TAG}" --title "咪咪记账 iOS ${RELEASE_TAG} (${IPA_FILE})" --notes-file RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" "build/${IPA_FILE}" \
              --title "咪咪记账 iOS ${RELEASE_TAG} (${IPA_FILE})" \
              --notes-file RELEASE_NOTES.md
          fi

          if gh release view v1.0.0 >/dev/null 2>&1; then
            # 兼容旧行为：v1.0.0 仍以固定名持有一份最新构建
            cp "build/${IPA_FILE}" build/MimiMoney-iOS.ipa
            gh release upload v1.0.0 build/MimiMoney-iOS.ipa --clobber
          fi

      - name: Update SideStore source JSON
        # Upserts apps.json then commits to main (raw URL). Pages artifact upload follows;
        # deploy-sidestore-pages job publishes it (GITHUB_TOKEN chore ≠ workflow trigger).
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(sidestore):')
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_VERSION="$(cat mimi-money-ios/VERSION 2>/dev/null || cat VERSION 2>/dev/null || echo "1.0.1")"
          IPA_FILE="MimiMoney-iOS-v${APP_VERSION}.ipa"
          IPA_PATH="mimi-money-ios/build/${IPA_FILE}"
          if [ ! -f "${IPA_PATH}" ]; then
            echo "::error::IPA not found at ${IPA_PATH}; cannot update SideStore source"
            exit 1
          fi
          IPA_SIZE="$(wc -c < "${IPA_PATH}" | tr -d ' ')"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${APP_VERSION}/${IPA_FILE}"
          DATE_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          NOTES="$(APP_VERSION="${APP_VERSION}" node -e '
            const fs = require("fs");
            const tag = "v" + process.env.APP_VERSION;
            let notes = "咪咪记账 iOS " + tag;
            const p = "mimi-money-ios/CHANGELOG.md";
            if (fs.existsSync(p)) {
              const text = fs.readFileSync(p, "utf8").replace(/\r\n/g, "\n");
              const start = text.indexOf("## [" + tag + "]");
              if (start !== -1) {
                const rest = text.slice(start);
                const nxt = rest.indexOf("\n## [", 4);
                const chunk = nxt === -1 ? rest : rest.slice(0, nxt);
                const lines = chunk.split("\n")
                  .map((ln) => ln.trim())
                  .filter((ln) => ln.startsWith("- "))
                  .map((ln) => ln.replace(/^-+\s*/, "").replace(/\*\*/g, ""))
                  .slice(0, 4);
                if (lines.length) notes = lines.join("; ");
              }
            }
            process.stdout.write(notes);
          ')"

          node scripts/update-sidestore-source.mjs \
            --version "${APP_VERSION}" \
            --date "${DATE_ISO}" \
            --download-url "${DOWNLOAD_URL}" \
            --size "${IPA_SIZE}" \
            --notes "${NOTES}" \
            --build-version "${GITHUB_RUN_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sidestore/apps.json
          if git diff --cached --quiet; then
            echo "SideStore source already up to date for v${APP_VERSION}"
          else
            git commit -m "chore(sidestore): publish v${APP_VERSION} in apps.json"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload SideStore Pages artifact
        # Artifact is the local sidestore/ AFTER upsert (includes new version).
        # deploy-sidestore-pages job publishes it; do not rely on chore commit triggers.
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(sidestore):')
        uses: actions/upload-pages-artifact@v3
        with:
          path: sidestore

  deploy-sidestore-pages:
    name: Deploy SideStore Pages
    needs: test-and-package-ios
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(sidestore):')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-sidestore
      cancel-in-progress: true
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
