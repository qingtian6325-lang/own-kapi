name: Build Mimi Money iOS (.ipa)

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-package-ios:
    name: Swift Test & Package iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mimi-money-ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Run Structural & Spec Verification
        run: node scripts/verify-swift-project.mjs --all

      - name: Run MimiMoneyTests (macOS host unit tests)
        run: swift test

      - name: Build iOS executable (SwiftPM, same as before)
        run: |
          IOS_SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "IOS_SDK_PATH=${IOS_SDK_PATH}" >> "$GITHUB_ENV"
          swift build -c release --product MimiMoneyApp \
            --triple arm64-apple-ios17.0 \
            -Xswiftc -sdk -Xswiftc "${IOS_SDK_PATH}" \
            -Xcc -isysroot -Xcc "${IOS_SDK_PATH}"
          BIN_PATH="$(find .build -path "*/release/MimiMoneyApp" -type f | head -n 1)"
          echo "BIN_PATH=${BIN_PATH}" >> "$GITHUB_ENV"
          echo "Built executable: ${BIN_PATH}"

      - name: Extract AppIntents metadata (appintentsmetadataprocessor)
        run: |
          # ------------------------------------------------------------------
          # Why this step exists:
          # `swift build` + manual .app assembly NEVER runs Xcode's AppIntents
          # metadata extraction, so previous IPAs shipped without
          # Metadata.appintents and iOS could not discover the
          # 「识别账单」 (ScanScreenshotIntent) action in Shortcuts at all.
          # We run the same processor Xcode would run, against the built
          # executable (the AppIntents definitions live in MimiMoneyCore,
          # statically linked into the app executable).
          # ------------------------------------------------------------------
          set -euo pipefail
          APP_VERSION="$(cat VERSION 2>/dev/null || echo "1.0.1")"
          rm -rf appintents-md
          mkdir -p appintents-md

          XCODE_CONTENTS="$(xcode-select -p | sed 's|/Developer$||')"
          PROCESSOR="$(find "${XCODE_CONTENTS}" -name appintentsmetadataprocessor -type f 2>/dev/null | head -n 1)"
          if [ -z "${PROCESSOR}" ]; then
            PROCESSOR="$(xcrun --find appintentsmetadataprocessor 2>/dev/null || true)"
          fi
          if [ -z "${PROCESSOR}" ] || [ ! -x "${PROCESSOR}" ]; then
            echo "::error::appintentsmetadataprocessor not found in the selected Xcode toolchain"
            exit 1
          fi
          echo "Using metadata processor: ${PROCESSOR}"

          # Xcode 26's processor requires --toolchain-dir and takes boolean
          # flags WITHOUT values (passing "FALSE" makes it an unknown argument).
          TOOLCHAIN_DIR="$(dirname "$(dirname "${PROCESSOR}")")"
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          echo "Toolchain dir: ${TOOLCHAIN_DIR}"
          echo "Xcode version: ${XCODE_VERSION}"
          "${PROCESSOR}" --help > processor-help.txt 2>&1 || true
          sed -n '1,60p' processor-help.txt || true

          SOURCE_FILES="$(find Sources -name '*.swift' | sort | tr '\n' ' ')"

          "${PROCESSOR}" \
            --toolchain-dir "${TOOLCHAIN_DIR}" \
            --module-name MimiMoneyCore \
            --sdk-root "${IOS_SDK_PATH}" \
            --xcode-version "${XCODE_VERSION}" \
            --platform-family iOS \
            --deployment-target 17.0 \
            --target-triple arm64-apple-ios17.0 \
            --binary-file "${BIN_PATH}" \
            --output "${PWD}/appintents-md" \
            --source-files ${SOURCE_FILES} \
            --compile-time-extraction \
            --deployment-aware-processing \
            --validate-assistant-intents

          echo "--- generated files ---"
          find appintents-md -type f | sort

      - name: Assemble .app bundle (with Metadata.appintents, WITHOUT legacy .shortcut)
        run: |
          rm -rf build
          mkdir -p build/Payload/MimiMoneyApp.app
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_BUILD="$(xcrun --sdk iphoneos --show-sdk-build-version)"
          XCODE_BUILD="$(xcodebuild -version | awk 'NR==2 {print $3}')"
          APP_VERSION="$(cat VERSION 2>/dev/null || echo "1.0.1")"

          cp "${BIN_PATH}" build/Payload/MimiMoneyApp.app/MimiMoneyApp
          chmod 755 build/Payload/MimiMoneyApp.app/MimiMoneyApp

          # Ship the extracted AppIntents metadata inside the .app so that
          # iOS registers 识别账单 / 修改账单 / 确认记账 for Shortcuts & Siri.
          cp -R appintents-md build/Payload/MimiMoneyApp.app/Metadata.appintents

          # Write standard 8-byte PkgInfo
          printf "APPL????" > build/Payload/MimiMoneyApp.app/PkgInfo

          # Copy real Mimi Money PNG App Icons
          echo "Copying custom Mimi Money AppIcon assets..."
          cp Resources/AppIcon60x60@2x.png build/Payload/MimiMoneyApp.app/AppIcon60x60@2x.png
          cp Resources/AppIcon60x60@3x.png build/Payload/MimiMoneyApp.app/AppIcon60x60@3x.png
          cp Resources/AppIcon76x76@2x.png build/Payload/MimiMoneyApp.app/AppIcon76x76@2x.png
          cp Resources/AppIcon1024.png build/Payload/MimiMoneyApp.app/AppIcon1024.png

          cat > build/Payload/MimiMoneyApp.app/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleDisplayName</key>
            <string>咪咪记账</string>
            <key>CFBundleExecutable</key>
            <string>MimiMoneyApp</string>
            <key>CFBundleIconFiles</key>
            <array>
              <string>AppIcon60x60@2x.png</string>
              <string>AppIcon60x60@3x.png</string>
            </array>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>AppIcon60x60</string>
                </array>
                <key>CFBundleIconName</key>
                <string>AppIcon</string>
              </dict>
            </dict>
            <key>CFBundleIdentifier</key>
            <string>com.jinghao.mimimoney</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>MimiMoneyApp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleSupportedPlatforms</key>
            <array>
              <string>iPhoneOS</string>
            </array>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER:-1}</string>
            <key>DTCompiler</key>
            <string>com.apple.compilers.llvm.clang.1_0</string>
            <key>DTPlatformBuild</key>
            <string>${SDK_BUILD}</string>
            <key>DTPlatformName</key>
            <string>iphoneos</string>
            <key>DTPlatformVersion</key>
            <string>${SDK_VERSION}</string>
            <key>DTSDKBuild</key>
            <string>${SDK_BUILD}</string>
            <key>DTSDKName</key>
            <string>iphoneos${SDK_VERSION}</string>
            <key>DTXcode</key>
            <string>1600</string>
            <key>DTXcodeBuild</key>
            <string>${XCODE_BUILD}</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>17.0</string>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>NSMicrophoneUsageDescription</key>
            <string>用于语音一句话记多笔账单</string>
            <key>NSSpeechRecognitionUsageDescription</key>
            <string>用于识别您的记账语音内容</string>
            <key>NSCameraUsageDescription</key>
            <string>用于拍摄小票与收据自动记账</string>
            <key>NSPhotoLibraryUsageDescription</key>
            <string>用于读取付款截图与添加账单图片附件</string>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key>
                <string>com.jinghao.mimimoney.deeplink</string>
                <key>CFBundleURLSchemes</key>
                <array>
                  <string>mimimoney</string>
                </array>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

          # Convert Info.plist to standard Apple binary plist and ad-hoc sign
          plutil -convert binary1 build/Payload/MimiMoneyApp.app/Info.plist
          codesign --force --deep --sign - build/Payload/MimiMoneyApp.app

      - name: Verify AppIntents metadata inside .app (HARD GATE)
        run: |
          # Fail the whole build if the metadata iOS needs is missing or does
          # not register the 识别账单 intent. This is the regression guard for
          # the v1.0.9 bug (IPA shipped with no Metadata.appintents at all).
          set -euo pipefail
          ACTIONS_DATA="build/Payload/MimiMoneyApp.app/Metadata.appintents/extract.actionsdata"
          if [ ! -f "${ACTIONS_DATA}" ]; then
            echo "::error::Metadata.appintents/extract.actionsdata is MISSING from the .app — iOS would not discover the 识别账单 action"
            find build/Payload/MimiMoneyApp.app -maxdepth 2 | sort || true
            exit 1
          fi
          if ! grep -a -q "ScanScreenshotIntent" "${ACTIONS_DATA}"; then
            echo "::error::extract.actionsdata does not contain ScanScreenshotIntent"
            exit 1
          fi
          # The legacy clipboard/openURL .shortcut flow must never come back into the bundle.
          if [ -e "build/Payload/MimiMoneyApp.app/MimiScreenshotBookkeeping.shortcut" ]; then
            echo "::error::Legacy .shortcut file must not be bundled into the .app"
            exit 1
          fi
          echo "✅ AppIntents verification passed:"
          ls -la build/Payload/MimiMoneyApp.app/Metadata.appintents/
          grep -a -o "ScanScreenshotIntent" "${ACTIONS_DATA}" | head -n 1

      - name: Package IPA
        run: |
          cd build && zip -qry MimiMoney-iOS.ipa Payload

      - name: Upload MimiMoney-iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MimiMoney-iOS-IPA
          path: mimi-money-ios/build/MimiMoney-iOS.ipa

      - name: Publish MimiMoney-iOS.ipa to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="$(cat VERSION 2>/dev/null || echo "1.0.1")"
          export RELEASE_TAG="v${APP_VERSION}"
          echo "Publishing release for ${RELEASE_TAG}..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}" --force

          node -e "
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const changelogPath = fs.existsSync('CHANGELOG.md') ? 'CHANGELOG.md' : 'mimi-money-ios/CHANGELOG.md';
            let content = '';
            if (fs.existsSync(changelogPath)) {
              const text = fs.readFileSync(changelogPath, 'utf8').replace(/\r\n/g, '\n');
              const startIdx = text.indexOf('## [' + tag + ']');
              if (startIdx !== -1) {
                const nextIdx = text.indexOf('\n## [', startIdx + 4);
                content = (nextIdx !== -1 ? text.substring(startIdx, nextIdx) : text.substring(startIdx)).trim();
              }
            }
            if (!content) {
              content = '## [' + tag + ']\n\n- 咪咪记账 iOS ' + tag + ' 自动化发布版本';
            }
            content += '\n\n### 📦 资产下载\n- **MimiMoney-iOS.ipa**：App 安装包（建议使用 Sideloadly / AltStore 签名安装）\n- 快捷指令无需下载任何文件：安装 App 后在系统「快捷指令」中添加内置动作「识别账单」即可（App 内「自动记账」页有四种触发方式的图文教程）';
            fs.writeFileSync('RELEASE_NOTES.md', content);
          "

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" build/MimiMoney-iOS.ipa --clobber
            gh release edit "${RELEASE_TAG}" --title "咪咪记账 iOS ${RELEASE_TAG} (MimiMoney-iOS.ipa)" --notes-file RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" build/MimiMoney-iOS.ipa \
              --title "咪咪记账 iOS ${RELEASE_TAG} (MimiMoney-iOS.ipa)" \
              --notes-file RELEASE_NOTES.md
          fi

          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 build/MimiMoney-iOS.ipa --clobber
          fi
